# Register the Qoder providers (CN + global) without changing the profile's
# current default model. The plugin reuses the Qoder desktop app's own sign-in;
# no separate OAuth flow is started.
#
# The row name is the package specifier, and it must equal the `name` field of
# this package.json verbatim. The host discovers the client half through
# `nearestPackage`, which compares the row specifier to the nearest manifest's
# `name` and silently drops the client bundle (no error, no log) on any
# mismatch — including bare-vs-scoped. A profile that depends on the scoped
# package name, or a `link:` install whose directory name differs from the
# package name, breaks the card the same way the 0.3.2 scoped rename did.
- insert:
    - id: llm-qoder
      name: "@eghrhegpe/dsh-connect-qoder"
