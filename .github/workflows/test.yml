name: test

# This repo keeps src/host + src/client as the sources and lib/ as a PURE BUILD
# ARTIFACT (untracked, git-ignored, rebuilt by `npm run build`). That is the
# opposite of the upstream layout, where lib/*.js were themselves the sources
# and therefore committed.
#
# The upstream workflow could run `npm test` on a bare checkout with no install,
# because there was nothing to build. Here, seven test files read lib/client.js
# — an artifact that does not exist in a fresh checkout — so the job must build
# first. The build needs tsdown, so `npm install` is now required. The note that
# used to sit here ("no npm ci: there is nothing to install") described a repo
# that no longer exists; keeping it would have kept the job permanently red.
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both lines the package declares support for. Node 24 is where
        # AbortSignal.any and the module mock hooks the tests rely on are stable.
        node: ['22.19', '24']
        # Windows is not redundant: the shim binds a loopback listener, the
        # catalog store relies on rename-over-existing, and the credential
        # reader shells out to PowerShell. Those behave differently elsewhere.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `.npmrc` sets legacy-peer-deps: the `@deepseek-ai/*` peers are supplied
      # by the host at runtime and are not on the public registry, so npm's
      # automatic peer install would fail before reaching tsdown.
      - run: npm install --no-audit --no-fund

      # Required before `npm test`: lib/client.js is an artifact, and the tests
      # that read it are asserting against the SHIPPED bundle on purpose (see
      # test/client-bundle.test.js). Building here rather than in a separate job
      # keeps the matrix honest — every OS/Node combination verifies the bundle
      # it actually tested.
      - name: Build lib/ from src/
        run: npm run build

      - name: Run tests
        run: npm test

      # Enforced as a FLOOR, not as a score: `test:coverage` carries
      # --test-coverage-lines/functions/branches set a little under the current
      # numbers, so a change that silently loses coverage fails the build while
      # an honest module split does not. A percentage still cannot say whether a
      # specific regression is defended — test/KNOWN_GAPS.md remains the real
      # register, and raising a threshold is a one-line review, not a redesign.
      - name: Coverage
        run: npm run test:coverage

  # Separate job: proves the artifact is reproducible from a clean install, and
  # that the host bundle and the client bundle both rebuild without drift.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - run: npm install --no-audit --no-fund

      - name: Rebuild from src/
        run: npm run build

      # `lib/` is untracked, so the upstream check (`git diff --exit-code --
      # lib/client.js`) would compare against a file that is not in the index
      # and pass vacuously. What is actually worth asserting here is that the
      # build is deterministic: build twice and require byte equality.
      - name: The build is reproducible
        run: |
          cp -r lib lib.first
          npm run build
          diff -r lib.first lib

      # The bundle is judged on behaviour, not byte equality with a committed
      # file (docs/issues/17): every pure function in the card is called with
      # the whole argument pool and the results are compared against the built
      # bundle. The script prints the probe and call counts, so a count here
      # would only be a number to let rot.
      - name: The rebuild behaves like the bundle the tests ran against
        run: npm run verify:bundle

      - name: The host bundle matches its sources
        run: npm run verify:host
